<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <script>(function(){var t=localStorage.getItem('theme');if(t!=='dark')document.documentElement.setAttribute('data-theme','light')})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Crypto3D 协议财务详情。">
  <title>协议财务详情 — Crypto3D</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../indicators/css/common.css">
  <style>
    .container { max-width: 1200px; }
    header { background: var(--bg-primary); }
    nav { display: flex; gap: 32px; }
    nav a { color: var(--text-secondary); text-decoration: none; font-size: 14px; font-weight: 500; }
    nav a:hover { color: var(--text-primary); }
    .header-right { display: flex; align-items: center; gap: 24px; }
    .protocol-title { display: flex; align-items: center; gap: 18px; }
    .protocol-icon-lg { display: grid; place-items: center; flex: none; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; }
    .protocol-info h1 { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; }
    .protocol-subtitle { color: var(--text-secondary); font-size: 13px; }
    .protocol-meta { display: flex; flex-wrap: wrap; gap: 10px 18px; margin-top: 14px; color: var(--text-tertiary); font-size: 11px; }
    .metric-status { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 999px; font-size: 10px; font-weight: 700; }
    .metric-status.pass { color: var(--accent); background: var(--accent-dim); }
    .metric-status.pending { color: var(--warning); background: var(--warning-dim); }
    .metric-status::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
    .tev-highlight { min-height: 168px; }
    .tev-status { color: var(--text-secondary); font-size: 11px; }
    .tev-value.na { color: var(--text-tertiary); }
    .tev-grid-compact { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .section { margin-bottom: 20px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; }
    .section-title { display: flex; align-items: center; gap: 9px; padding-bottom: 14px; border-bottom: 1px solid var(--border); font-size: 16px; font-weight: 700; }
    .financial-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
    .financial-table th, .financial-table td { padding: 13px 12px !important; }
    .financial-table th:first-child, .financial-table td:first-child { text-align: left; }
    .financial-table .formula-col { color: var(--text-tertiary); font-size: 11px; }
    .financial-table .value-col { font-family: 'JetBrains Mono', monospace; font-size: 13px; text-align: right; white-space: nowrap; }
    .financial-table .na { color: var(--text-tertiary); }
    .section-note { margin-top: 14px; padding: 12px 14px; border-radius: 8px; color: var(--text-secondary); background: var(--bg-tertiary); font-size: 12px; line-height: 1.7; }
    .source-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
    .source-item { background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 10px; }
    .source-item span { display: block; color: var(--text-tertiary); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
    .source-item strong { display: block; margin-top: 4px; font-size: 12px; overflow-wrap: anywhere; }
    .empty-detail { padding: 80px 20px; color: var(--text-secondary); text-align: center; }
    @media(max-width:900px){ .tev-grid-compact{grid-template-columns:repeat(2,minmax(0,1fr))}.tev-grid-compact .tev-summary-item:first-child{grid-column:1/-1}.source-grid{grid-template-columns:1fr}.financial-table .formula-col{display:none} }
    @media(max-width:768px){nav{display:none}.protocol-title{align-items:flex-start}.protocol-info h1{font-size:28px!important}.section{padding:18px!important}}
  </style>
  <link rel="stylesheet" href="../css/theme-override.css">
</head>
